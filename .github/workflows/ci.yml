name: CI/CD with Claude Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.set-python.outputs.python-version }}
    steps:
      - uses: actions/checkout@v4
      - id: set-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build
        run: python setup.py build

  unit_tests:
    runs-on: ubuntu-latest
    needs: [build, setup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest --junitxml=results.xml --cov=src --cov-report=xml --verbose
        env:
          PYTHONPATH: "."
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xml

  claude_review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    needs: [unit_tests, setup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .
      - name: Claude Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          output=$(python scripts/claude_review.py results.xml)
          gh pr comment ${{ github.event.pull_request.number }} --body "$output"
          
  deploy:
    runs-on: ubuntu-latest
    needs: claude_review
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Deploy to Staging
        run: bash scripts/deploy_staging.sh
