name: CI/CD with Claude Validation and Approval Gates

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize]
  push:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.set-python.outputs.python-version }}
    steps:
      - uses: actions/checkout@v4
      - id: set-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

  # Static analysis and code quality checks (fail-fast)
  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting with Black
        run: black --check --line-length 88 .
        continue-on-error: false

      - name: Check import sorting with isort
        run: isort --check-only .
        continue-on-error: false

      - name: Run flake8 linting
        run: flake8 --max-complexity 12 .
        continue-on-error: false

      - name: Run mypy type checking
        run: mypy --strict src/
        continue-on-error: false

  # Security scanning (parallel with lint for faster feedback)
  security:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bandit security scan
        run: bandit -r src/ -f json -o bandit-report.json
        continue-on-error: false

      - name: Run safety vulnerability check
        run: safety check --json
        continue-on-error: false

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json

  build:
    runs-on: ubuntu-latest
    needs: [setup, lint, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build
        run: python setup.py build

  unit_tests:
    runs-on: ubuntu-latest
    needs: [build, setup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --junitxml=results.xml --cov=src --cov-report=xml --cov-report=term --verbose
        env:
          PYTHONPATH: "."

      - name: Check coverage threshold (80%)
        run: |
          coverage report --fail-under=80
        env:
          PYTHONPATH: "."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results.xml
            coverage.xml
          retention-days: 30

  # claude_review:
  #   runs-on: ubuntu-latest
  #   needs: unit_tests
